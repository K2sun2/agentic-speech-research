<style>body{font:17px/1.7 system-ui;max-width:850px;margin:40px auto;padding:20px}audio{width:100%}button,input,select{font:inherit;margin:8px;padding:8px}</style>
<h1>自然对话接话盲标</h1><p>使用耳机。左声道是当前需要判断是否说完的用户，右声道是对话另一方。只听当前时点之前的5秒语音，判断此刻是否适合由助手开始完整回应；右声道用于理解上下文。无需猜测后续内容。若上下文不足、串音或角色不清楚，请选“不确定”。</p>
<p>请每位真实听者独立填写匿名编号。页面不提供默认答案，也不显示模型分数。</p>
<input id="who" placeholder="匿名听者编号"><button id="start">开始或恢复</button><section id="work" hidden>
<p id="progress"></p><audio id="audio" controls></audio><p><select id="action"><option value="">尚未标注</option><option value="wait">继续等待</option><option value="respond">开始完整回应</option><option value="both">两者都合理</option><option value="uncertain">不确定</option></select></p>
<p><select id="artifact"><option value="">音频状况尚未标注</option><option value="none">可清楚判断</option><option value="mild">轻微问题</option><option value="severe">明显串音或角色不清</option><option value="uncertain">不确定</option></select></p>
<input id="notes" placeholder="判断依据或问题，可留空"><p><button id="prev">上一条</button><button id="next">保存并下一条</button><button id="export">导出我的标注</button></p></section>
